<section class="card">
 <h2>Buscador de instalaciones</h2>

 <form [formGroup]="form">
    <div class="content-card">
        <div class="form-input-wrapper">
        <label class="form-input-label" for="name">Nombre</label>
        <input class="form-input-field" id="name" type="text" formControlName="name" />
    </div>
    <div class="form-input-wrapper">
        <label class="form-input-label" for="address">Dirección</label>
        <input class="form-input-field" id="address" type="text" formControlName="address" />
    </div>
    <div class="form-input-wrapper">
        <label class="form-input-label" for="location">Población</label>
        <input class="form-input-field" id="location" type="text" formControlName="location" />
    </div>
    <div class="form-input-wrapper">
        <label class="form-input-label" for="city">Ciudad</label>
        <input class="form-input-field" id="city" type="text" formControlName="city" />
    </div>
    </div>
    
  <div class="actions">
   <button class="app-btn" type="button" (click)="reset()">Reiniciar</button>
   <button (click)="openModalInstallation()" class="app-btn" type="button">Nuevo</button>
  </div>
 </form>

 <!-- Aqui abrimos los modales necesarios -->
   @if(isGeneralParamsModalOpen === true){
    <app-modal-installation
    [visible]="isGeneralParamsModalOpen"
    (closed)="closeModalInstallation()"></app-modal-installation>
   }

</section>
