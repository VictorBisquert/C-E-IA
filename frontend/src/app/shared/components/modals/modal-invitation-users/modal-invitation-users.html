@if (visible) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title">Invitación usuario</h2>
      </div>

      <div class="modal-body">
        <form [formGroup]="InviteForm" (ngSubmit)="sendForm()">

          <!-- Email -->
          <div class="form-input-wrapper">
            <label class="form-input-label" for="email">Email</label>
            <input
              class="form-input-field"
              id="email"
              type="text"
              formControlName="email"
            />
          </div>

          <!-- Rol (Dropdown) -->
          <div class="form-input-wrapper">
            <label class="form-input-label" for="role">Rol</label>
            <select
              class="form-input-field"
              id="role"
              formControlName="role">
              <option value="" disabled selected>Selecciona un rol</option>
              <option value="Admin">Admin</option>
              <option value="User">User</option>
            </select>
          </div>

          <!-- Botón -->
          <button
            class="app-btn"
            type="submit"
            [disabled]="InviteForm.invalid || loading">
            {{ loading ? 'Enviando...' : 'Enviar invitación' }}
          </button>

        </form>
      </div>
    </div>
  </div>
}
